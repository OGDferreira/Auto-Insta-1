{% extends "base.html" %}{% block title %}Entrar · Auto-Insta{% endblock %}

<form method="post"><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" required></label><button>Entrar</button></form>
<p class="muted">Ainda não tem conta? <a href="/register">Registre-se</a></p></div>{% endblock %}
