<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Auto-Insta{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#080b14;--panel:#101522;--panel-2:#151c2d;--line:#273149;--text:#f4f7ff;--muted:#8d99b5;--primary:#8b7cff;--cyan:#55d6ff;--danger:#ff7088;--success:#65e6a3}
    *{box-sizing:border-box} body{font-family:"DM Sans",sans-serif;max-width:1180px;margin:0 auto;padding:0 1.25rem 3rem;background:radial-gradient(circle at 80% -10%,#202052 0,transparent 35%),var(--bg);color:var(--text);min-height:100vh}
    nav{display:flex;justify-content:space-between;align-items:center;padding:1.2rem 0 1.8rem;border-bottom:1px solid var(--line);margin-bottom:2rem}
    .brand{font-family:"Space Grotesk",sans-serif;font-size:1.35rem;letter-spacing:-.04em}.brand span{color:var(--cyan)}
    .card{background:linear-gradient(145deg,rgba(21,28,45,.96),rgba(12,16,28,.96));border:1px solid var(--line);border-radius:20px;padding:1.35rem;margin:1rem 0;box-shadow:0 18px 50px rgba(0,0,0,.2);transition:border-color .2s,transform .2s,box-shadow .2s}.card:hover{border-color:#46547b;box-shadow:0 20px 60px rgba(44,41,120,.2)}
    h1,h2{font-family:"Space Grotesk",sans-serif;letter-spacing:-.04em} h1{font-size:clamp(2rem,5vw,3.5rem);margin:.4rem 0} h2{margin:.2rem 0 1rem} p{color:var(--muted)}
    label{display:block;color:var(--muted);font-size:.88rem;font-weight:600;margin:.8rem 0} input,select,textarea{display:block;width:100%;padding:.78rem .9rem;margin:.35rem 0 0;background:#0c111e;color:var(--text);border:1px solid var(--line);border-radius:11px;font:inherit;transition:border-color .2s,box-shadow .2s} input:focus,select:focus,textarea:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px rgba(139,124,255,.16)} textarea{min-height:90px;resize:vertical}
    button,.button{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.72rem 1rem;cursor:pointer;border:0;border-radius:11px;background:linear-gradient(135deg,var(--primary),#6254e8);color:white;font:600 .9rem "DM Sans",sans-serif;text-decoration:none;transition:transform .2s,box-shadow .2s,filter .2s}button:hover,.button:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 8px 24px rgba(112,92,255,.32)}button.secondary,.button.secondary{background:var(--panel-2);border:1px solid var(--line);box-shadow:none}
    .error{color:var(--danger)}.muted{color:var(--muted);font-size:.9rem}.top-actions{display:flex;align-items:center;gap:.8rem} .account-pills{display:flex;gap:.55rem;flex-wrap:wrap;margin:1rem 0}.account-pill{display:flex;align-items:center;gap:.5rem;padding:.4rem .7rem;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;font-size:.85rem}.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--primary));font-weight:700;color:#07101c}.health{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success)}.health.warn{background:#ffc857;box-shadow:0 0 10px #ffc857}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem}.col-7{grid-column:span 7}.col-5{grid-column:span 5}@media(max-width:800px){.col-7,.col-5{grid-column:1/-1}.top-actions{gap:.4rem}}
    .eyebrow{color:var(--cyan);font-size:.78rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.hero{padding:1.4rem 0 .4rem}.hero p{max-width:620px}.dropzone{border:1px dashed #4b5880;border-radius:14px;padding:1rem;text-align:center;background:rgba(85,214,255,.03);cursor:pointer}.dropzone:hover{border-color:var(--cyan);background:rgba(85,214,255,.07)}.dropzone input{display:none}.preview{max-width:100%;max-height:180px;border-radius:12px;margin-top:.8rem;display:none}.progress{height:5px;background:#252d43;border-radius:99px;overflow:hidden;margin-top:.8rem}.progress span{display:block;height:100%;width:0;background:var(--cyan);transition:width .2s}.status-badge{display:inline-flex;padding:.3rem .6rem;border-radius:999px;font-size:.75rem;font-weight:700;background:#252d43;color:var(--muted)}.status-badge.scheduled{color:#b7adff;background:rgba(139,124,255,.13)}.status-badge.published{color:var(--success);background:rgba(101,230,163,.1)}.status-badge.failed{color:var(--danger);background:rgba(255,112,136,.1)}
    table{width:100%;border-collapse:collapse}td,th{padding:.8rem .4rem;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}.table-wrap{overflow-x:auto}.flash{color:var(--danger)}.tabs{display:flex;gap:.4rem;overflow-x:auto;margin:1rem 0 1.5rem;padding-bottom:.3rem}.tab{padding:.65rem .85rem;border:1px solid var(--line);border-radius:10px;color:var(--muted);text-decoration:none;white-space:nowrap}.tab:hover,.tab.active{color:var(--text);border-color:var(--primary);background:rgba(139,124,255,.12)}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem}.metric{padding:1rem;border:1px solid var(--line);border-radius:14px;background:rgba(16,21,34,.8)}.metric strong{display:block;font:700 1.65rem "Space Grotesk";margin-top:.35rem}.metric small{color:var(--muted)}.check-list{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}.check-list label{margin:0;padding:.7rem;border:1px solid var(--line);border-radius:10px}.thumb-list{display:grid;gap:.55rem;margin:1rem 0}.thumb-item{display:flex;align-items:center;gap:.7rem;padding:.55rem;border:1px solid var(--line);border-radius:11px;background:#0c111e;cursor:grab}.thumb{width:46px;height:46px;object-fit:cover;border-radius:8px;background:#20283b}.drag-handle{color:var(--muted)}@media(max-width:650px){.metric-grid{grid-template-columns:repeat(2,1fr)}.check-list{grid-template-columns:1fr}}
  </style>
  <style>
    .dashboard-hero{display:flex;align-items:flex-end;justify-content:space-between;padding:2.2rem 0 1.3rem}.dashboard-hero h1{margin:.45rem 0 .25rem}.live-indicator{display:flex;align-items:center;gap:.5rem;color:var(--success);font-size:.82rem;font-weight:700;padding:.55rem .75rem;border:1px solid rgba(101,230,163,.2);border-radius:999px;background:rgba(101,230,163,.06)}.live-indicator i{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 12px var(--success)}
    .workspace-tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin:0 0 2rem;overflow-x:auto}.workspace-tab{display:flex;align-items:center;gap:.6rem;padding:.9rem 1rem;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;font-weight:600}.workspace-tab span{color:#5e6a85;font:600 .7rem "Space Grotesk"}.workspace-tab:hover,.workspace-tab.active{color:var(--text);border-color:var(--cyan)}.workspace-tab.active span{color:var(--cyan)}.workspace-view{display:none}.workspace-view.active{display:block;animation:fade-in .25s ease}@keyframes fade-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    .section-heading,.panel-header{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem}.section-heading{margin-bottom:1.15rem}.section-heading h2{margin:.35rem 0 0}.section-note{color:var(--muted);font-size:.82rem}.metric-grid{grid-template-columns:repeat(4,1fr)}.metric{padding:1.2rem;border-radius:15px}.metric-detail{display:block;color:var(--muted);font-size:.78rem;margin-top:.25rem}.metric strong{font-size:2rem}.overview-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:1rem;margin-top:1rem}.panel{background:linear-gradient(145deg,rgba(21,28,45,.96),rgba(12,16,28,.96));border:1px solid var(--line);border-radius:16px;padding:1.35rem}.panel h3{font-family:"Space Grotesk",sans-serif;margin:.35rem 0 .7rem}.panel-feature{background:linear-gradient(135deg,rgba(37,47,78,.9),rgba(15,22,39,.98));min-height:205px}.panel-feature p{max-width:440px}.panel-kicker{color:var(--cyan);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.panel-header{align-items:flex-start}.status-line{display:flex;justify-content:space-between;padding:.8rem 0;border-bottom:1px solid var(--line);color:var(--muted)}.status-line:last-child{border:0}.status-line strong{color:var(--text)}
    .queue-layout{display:grid;grid-template-columns:minmax(280px,390px) 1fr;gap:1rem}.composer h3{margin-bottom:1.1rem}.account-check{display:flex!important;align-items:center;gap:.55rem;margin:0!important;padding:.65rem!important}.account-check input{width:auto;margin:0}.account-check b{font-size:.85rem;color:var(--text)}.check-mark{margin-left:auto;color:var(--success)}.mini-avatar,.table-account img{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--cyan),var(--primary));color:#07101c;font-size:.72rem;font-weight:700}.mini-avatar img,.table-account img{width:100%;height:100%;object-fit:cover}.dropzone{margin-top:1rem}.dropzone b{color:var(--text)}.dropzone small{color:var(--muted)}.field-hint{display:block;color:var(--muted);font-size:.72rem;font-weight:400;margin-top:.35rem}.form-note{font-size:.78rem;line-height:1.45}.composer button{width:100%}.thumb-item{border-radius:10px}.thumb-item small,.table-wrap td small{display:block;color:var(--muted);font-size:.72rem;margin-top:.25rem}.queue-panel{min-width:0}.table-account{display:flex;align-items:center;gap:.45rem;white-space:nowrap}.table-wrap td,.table-wrap th{padding:.9rem .5rem}.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted)}.empty-state>span{display:block;color:var(--cyan);font-size:2rem;margin-bottom:.5rem}.empty-state h3{color:var(--text);margin:.2rem}.empty-state p{margin-top:.4rem}
    .account-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.account-card{padding:1.2rem;background:linear-gradient(145deg,rgba(21,28,45,.96),rgba(12,16,28,.96));border:1px solid var(--line);border-radius:16px}.account-card-top{display:flex;justify-content:space-between;align-items:flex-start}.profile-avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--cyan),var(--primary));color:#07101c;font:700 1.3rem "Space Grotesk"}.profile-avatar img{width:100%;height:100%;object-fit:cover}.profile-avatar.small{width:42px;height:42px;font-size:1rem}.account-card h3{font-family:"Space Grotesk";margin:1rem 0 .2rem}.account-card p{font-size:.82rem;margin:.2rem 0 1.2rem}.account-card-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:.8rem}.text-button{padding:0;background:none;color:var(--muted);font-size:.78rem}.text-button:hover{transform:none;box-shadow:none;background:none;color:var(--danger)}.automation-list{display:grid;gap:1rem}.automation-card{display:grid;grid-template-columns:190px 1fr auto;align-items:start;gap:1.2rem}.automation-title{display:flex;gap:.75rem;align-items:center}.automation-title h3{margin:0;font-size:1rem}.automation-title p{font-size:.78rem;margin:.25rem 0}.automation-fields{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.automation-fields label{margin:0}.automation-fields label>span{display:flex;align-items:center;gap:.5rem;color:var(--text)}.automation-fields input{width:auto;margin:0}.automation-card button{align-self:end;white-space:nowrap}
    @media(max-width:850px){.queue-layout,.overview-grid{grid-template-columns:1fr}.account-grid{grid-template-columns:repeat(2,1fr)}.automation-card{grid-template-columns:1fr}.automation-card button{justify-self:start}}@media(max-width:600px){.dashboard-hero{display:block}.live-indicator{width:max-content;margin-top:1rem}.metric-grid{grid-template-columns:repeat(2,1fr)}.account-grid,.automation-fields{grid-template-columns:1fr}.metric{padding:.9rem}.metric strong{font-size:1.6rem}.workspace-tab{padding:.8rem .65rem;font-size:.84rem}.section-heading{align-items:flex-start;flex-direction:column}.section-heading .button{width:100%}}
  </style>
</head>
<body>
<nav><a class="brand" href="/">Auto<span>·</span>Insta</a>{% if request.session.get("user_id") %}<div class="top-actions"><span class="muted">Workspace</span><form method="post" action="/logout"><button class="secondary">Sair</button></form></div>{% endif %}</nav>
{% block content %}{% endblock %}
</body>
</html>
