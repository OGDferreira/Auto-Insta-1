{% extends "base.html" %}{% block title %}Registro · Auto-Insta{% endblock %}
{% block content %}<div class="card" style="max-width:480px;margin:8vh auto"><div class="eyebrow">Comece agora</div><h1>Criar conta</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post"><label>E-mail<input name="email" type="email" required></label><label>Senha (mínimo 10 caracteres)<input name="password" type="password" minlength="10" required></label><button>Registrar</button></form>
<p class="muted">Já possui conta? <a href="/login">Entrar</a></p></div>{% endblock %}
