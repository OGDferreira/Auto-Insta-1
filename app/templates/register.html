{% extends "base.html" %}{% block title %}Registro · Auto-Insta{% endblock %}
{% block content %}<div class="card auth-card"><div class="eyebrow">Comece agora</div><h1>Criar conta</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post"><label>Nome de usuário<input name="username" maxlength="80" pattern="[a-zA-Z0-9_.-]{2,80}" placeholder="ex: guilherme" required></label><label>E-mail<input name="email" type="email" required></label><label>Senha (mínimo 10 caracteres)<input name="password" type="password" minlength="10" required></label><button type="submit"><i data-lucide="user-plus"></i> Registrar</button></form>
<p class="muted">Já possui conta? <a href="/login">Entrar</a></p></div>{% endblock %}
