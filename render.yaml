services:
  - type: web
    name: auto-insta-aeqr
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_HOSTS
        value: auto-insta-aeqr.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: FERNET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SERVICE_ROLE
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: media
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://auto-insta-aeqr.onrender.com
      - key: INSTAGRAM_REDIRECT_URI
        value: https://auto-insta-aeqr.onrender.com/auth/callback
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: GRAPH_API_VERSION
        value: v25.0
      - key: COOKIE_SECURE
        value: "true"
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: EDITOR_UPLOAD_SIZE_MB
        value: "50"
      - key: UPLOAD_DIR
        value: uploads
