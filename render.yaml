services:
  - type: web
    name: auto-insta-web
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FERNET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: media
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://auto-insta-web.onrender.com
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: GRAPH_API_VERSION
        value: v25.0
      - key: COOKIE_SECURE
        value: "true"
